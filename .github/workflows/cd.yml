name: CD — Build, Publish (GHCR) & Promote

on:
  push:
    branches: [dev, staging, main]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      target_env:
        description: "Target environment to deploy"
        required: true
        default: "staging"
        type: choice
        options:
          - dev
          - staging
          - production

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    name: Build & Push ${{ matrix.service }} Image to GHCR
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: mobile_ws
            context: ./services/mobile_ws
            dockerfile: ./services/mobile_ws/Dockerfile
          - service: webhook_mock
            context: ./services/webhook_mock
            dockerfile: ./services/webhook_mock/Dockerfile
          - service: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata & tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy-dev:
    name: Deploy to Dev Environment
    needs: build-and-push
    if: github.ref == 'refs/heads/dev' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'dev')
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ vars.DEV_APP_URL || 'https://dev.djangoair.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify dev release manifest
        run: |
          echo "Promoting sha-${GITHUB_SHA::7} to DEV environment"
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
      - name: Trigger dev deployment webhook (if configured)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.DEV_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "${DEPLOY_WEBHOOK_URL:-}" ]; then
            curl -fsSL -X POST "${DEPLOY_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"env\":\"dev\",\"sha\":\"${GITHUB_SHA}\"}"
          else
            echo "DEV_DEPLOY_WEBHOOK_URL not set; skipping external deploy hook."
          fi

  deploy-staging:
    name: Deploy to Staging Environment
    needs: build-and-push
    if: github.ref == 'refs/heads/staging' || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'staging')
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_APP_URL || 'https://staging.djangoair.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify staging release manifest
        env:
          IMAGE_TAG: staging
        run: |
          echo "Promoting sha-${GITHUB_SHA::7} to STAGING environment"
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
      - name: Trigger staging deployment webhook (if configured)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.STAGING_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "${DEPLOY_WEBHOOK_URL:-}" ]; then
            curl -fsSL -X POST "${DEPLOY_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"env\":\"staging\",\"sha\":\"${GITHUB_SHA}\"}"
          else
            echo "STAGING_DEPLOY_WEBHOOK_URL not set; skipping external deploy hook."
          fi

  deploy-production:
    name: Deploy to Production (main)
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.target_env == 'production')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PROD_APP_URL || 'https://djangoair.example.com' }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify production release manifest
        env:
          IMAGE_TAG: ${{ github.ref_name == 'main' && 'latest' || github.ref_name }}
        run: |
          echo "Promoting ${IMAGE_TAG} (sha-${GITHUB_SHA::7}) to PRODUCTION environment"
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q
      - name: Trigger production deployment webhook (if configured)
        env:
          DEPLOY_WEBHOOK_URL: ${{ secrets.PROD_DEPLOY_WEBHOOK_URL }}
        run: |
          if [ -n "${DEPLOY_WEBHOOK_URL:-}" ]; then
            curl -fsSL -X POST "${DEPLOY_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"env\":\"production\",\"ref\":\"${GITHUB_REF_NAME}\",\"sha\":\"${GITHUB_SHA}\"}"
          else
            echo "PROD_DEPLOY_WEBHOOK_URL not set; skipping external deploy hook."
          fi
