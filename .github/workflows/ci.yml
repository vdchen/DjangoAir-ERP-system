name: CI

on:
  pull_request:
    branches: [main, staging, dev]
  push:
    branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  backend:
    name: Backend Lint, Security & Pytest (PostgreSQL + Redis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: djangoair_test
          POSTGRES_USER: djangoair
          POSTGRES_PASSWORD: djangoair_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Lint with ruff
        working-directory: backend
        run: ruff check .
      - name: Static security analysis (bandit)
        working-directory: backend
        run: bandit -r apps config -ll
      - name: Check migrations are up to date
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_DB: djangoair_test
          POSTGRES_USER: djangoair
          POSTGRES_PASSWORD: djangoair_secret
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py makemigrations --check --dry-run
      - name: Django production deployment security check
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          DJANGO_SECRET_KEY: "ci-verified-random-secret-key-with-sufficient-entropy-for-deploy-checks-2026!"
          DJANGO_ALLOWED_HOSTS: "djangoair.example.com"
          POSTGRES_DB: djangoair_test
          POSTGRES_USER: djangoair
          POSTGRES_PASSWORD: djangoair_secret
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
        run: python manage.py check --deploy --tag security --fail-level WARNING
      - name: Run pytest with coverage
        working-directory: backend
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          POSTGRES_DB: djangoair_test
          POSTGRES_USER: djangoair
          POSTGRES_PASSWORD: djangoair_secret
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5432
          REDIS_URL: redis://127.0.0.1:6379/0
        run: pytest -v --cov=apps --cov-report=term-missing

  flask-services:
    name: Flask Mobile WS & Webhook Mock Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test mobile_ws
        working-directory: services/mobile_ws
        run: |
          pip install -r requirements.txt
          pytest -v
      - name: Test webhook_mock
        working-directory: services/webhook_mock
        run: |
          pip install -r requirements.txt
          pytest -v

  frontend-build:
    name: Frontend Webpack Production Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install and build both SPAs
        working-directory: frontend
        run: |
          npm install
          npm run build
          test -f dist/customer/index.html
          test -f dist/staff/index.html

  docker-validate:
    name: Multi-Environment Docker Compose Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate base, dev, test, staging, and prod Compose configs
        run: |
          docker compose config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.test.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.staging.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q

  docker-build-check:
    name: PR Docker Build Check (${{ matrix.service }})
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: backend
            context: ./backend
            dockerfile: ./backend/Dockerfile
          - service: mobile_ws
            context: ./services/mobile_ws
            dockerfile: ./services/mobile_ws/Dockerfile
          - service: webhook_mock
            context: ./services/webhook_mock
            dockerfile: ./services/webhook_mock/Dockerfile
          - service: nginx
            context: .
            dockerfile: ./nginx/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Verify Dockerfile builds cleanly (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
