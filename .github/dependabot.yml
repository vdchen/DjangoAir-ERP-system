version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    # Stay on Django 5.2 LTS (supported through April 2028) until simplejwt & full DRF ecosystem certify Django 6.x
    ignore:
      - dependency-name: "django"
        versions: [">=6.0.0"]

  - package-ecosystem: "pip"
    directory: "/services/mobile_ws"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "flask"
    commit-message:
