<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DjangoAir Third-Party Webhook Mock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">Third-Party Webhook Receiver (Flask Mock)</h1>
        <p class="text-muted mb-0">Verifies <code>X-DjangoAir-Signature</code> (HMAC-SHA256) and records partner webhook deliveries.</p>
      </div>
      <div class="d-flex gap-2">
        <button onclick="loadEvents()" class="btn btn-primary btn-sm">Refresh</button>
        <button onclick="clearEvents()" class="btn btn-outline-danger btn-sm">Clear Log</button>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Verified Webhook Deliveries (<span id="count">{{ events|length }}</span>)</div>
      <div id="events-container" class="list-group list-group-flush"></div>
    </div>
  </div>

  <script>
    async function loadEvents() {
      const res = await fetch('/mock-webhook/events');
      const data = await res.json();
      document.getElementById('count').textContent = data.count;
      const container = document.getElementById('events-container');
      if (!data.events.length) {
        container.innerHTML = '<div class="list-group-item text-muted">No webhook events received yet. Book a flight, check in, or board a passenger to see live deliveries.</div>';
        return;
      }
      container.innerHTML = data.events.map(ev => `
        <div class="list-group-item">
          <div class="d-flex justify-content-between align-items-center mb-1">
            <span class="badge text-bg-success">HMAC Verified</span>
            <strong>${ev.event}</strong>
            <small class="text-muted">${ev.received_at}</small>
          </div>
          <pre class="mb-0 small bg-light p-2 rounded">${JSON.stringify(ev.payload, null, 2)}</pre>
        </div>
      `).join('');
    }
    async function clearEvents() {
      await fetch('/mock-webhook/events', { method: 'DELETE' });
      loadEvents();
    }
    loadEvents();
    setInterval(loadEvents, 5000);
  </script>
</body>
</html>
