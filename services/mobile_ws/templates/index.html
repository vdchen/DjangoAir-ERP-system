<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DjangoAir Mobile WebSocket Mock</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
</head>
<body class="bg-light">
  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <div>
        <h1 class="h3 mb-1">DjangoAir Mobile WebSocket API (Flask Mock)</h1>
        <p class="text-muted mb-0">Live flight, check-in, and gate boarding push updates via Socket.IO + Redis Pub/Sub.</p>
      </div>
      <span id="status-badge" class="badge text-bg-secondary">Connecting...</span>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <div class="row g-2 align-items-end">
          <div class="col-md-4">
            <label class="form-label">Flight Number</label>
            <input id="flight-input" class="form-control" placeholder="e.g. DA101-1" />
          </div>
          <div class="col-md-2">
            <button id="sub-flight-btn" class="btn btn-primary w-100">Subscribe Flight</button>
          </div>
          <div class="col-md-4">
            <label class="form-label">Ticket Code</label>
            <input id="ticket-input" class="form-control" placeholder="e.g. DA-ALICE101" />
          </div>
          <div class="col-md-2">
            <button id="sub-ticket-btn" class="btn btn-outline-primary w-100">Subscribe Ticket</button>
          </div>
        </div>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-header bg-white fw-semibold">Incoming Push Events</div>
      <ul id="events-list" class="list-group list-group-flush"></ul>
    </div>
  </div>

  <script>
    const socket = io({ path: '/socket.io' });
    const badge = document.getElementById('status-badge');
    const list = document.getElementById('events-list');

    function addEvent(title, payload) {
      const li = document.createElement('li');
      li.className = 'list-group-item';
      li.innerHTML = `<div class="fw-semibold">${title}</div><pre class="mb-0 small text-muted">${JSON.stringify(payload, null, 2)}</pre>`;
      list.prepend(li);
    }

    socket.on('connect', () => {
      badge.className = 'badge text-bg-success';
      badge.textContent = 'Connected';
    });
    socket.on('disconnect', () => {
      badge.className = 'badge text-bg-danger';
      badge.textContent = 'Disconnected';
    });
    socket.on('subscribed', (data) => addEvent('Subscribed to Room', data));
    socket.on('flight_event', (data) => addEvent(`Event: ${data.event || 'update'}`, data));

    document.getElementById('sub-flight-btn').addEventListener('click', () => {
      const val = document.getElementById('flight-input').value.trim();
      if (val) socket.emit('subscribe_flight', { flight_number: val });
    });
    document.getElementById('sub-ticket-btn').addEventListener('click', () => {
      const val = document.getElementById('ticket-input').value.trim();
      if (val) socket.emit('subscribe_ticket', { ticket_code: val });
    });
  </script>
</body>
</html>
