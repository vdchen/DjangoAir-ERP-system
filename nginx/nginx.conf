upstream django_backend {
    server backend:8000;
}

upstream flask_mobile_ws {
    server mobile_ws:5001;
}

upstream flask_webhook_mock {
    server webhook_mock:5002;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Django REST API & OpenAPI Docs
    location /api/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://django_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flask Mobile WebSocket API (Socket.IO upgrade)
    location /socket.io/ {
        proxy_pass http://flask_mobile_ws/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }

    location /mobile-mock/ {
        proxy_pass http://flask_mobile_ws/mobile-mock/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Flask Third-Party Webhook Mock
    location /mock-webhook/ {
        proxy_pass http://flask_webhook_mock/mock-webhook/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Independent Staff SPA (/staff/)
    location = /staff {
        return 301 /staff/;
    }

    location /staff/ {
        alias /usr/share/nginx/html/staff/;
        try_files $uri $uri/ /staff/index.html;
    }

    # Independent Customer SPA (/)
    location / {
        root /usr/share/nginx/html/customer;
        try_files $uri $uri/ /index.html;
    }
}
