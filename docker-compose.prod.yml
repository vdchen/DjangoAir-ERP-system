# Production (main) override: immutable pinned GHCR images, hardened prod settings, zero dev tools
services:
  postgres:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  redis:
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 300M

  mailpit:
    profiles: ["disabled"]

  backend:
    image: ghcr.io/${GHCR_REPO:-vdchen/djangoair-erp-system}/backend:${IMAGE_TAG:-latest}
    env_file:
      - ${ENV_FILE:-.env.prod.example}
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  celery_worker:
    image: ghcr.io/${GHCR_REPO:-vdchen/djangoair-erp-system}/backend:${IMAGE_TAG:-latest}
    env_file:
      - ${ENV_FILE:-.env.prod.example}
    environment:
      APP_ENV: prod
      DJANGO_SETTINGS_MODULE: config.settings.prod
    command: celery -A config worker --loglevel=warning --concurrency=4
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  mobile_ws:
    image: ghcr.io/${GHCR_REPO:-vdchen/djangoair-erp-system}/mobile_ws:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 384M

  webhook_mock:
    image: ghcr.io/${GHCR_REPO:-vdchen/djangoair-erp-system}/webhook_mock:${IMAGE_TAG:-latest}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  nginx:
    image: ghcr.io/${GHCR_REPO:-vdchen/djangoair-erp-system}/nginx:${IMAGE_TAG:-latest}
    ports:
      - "${NGINX_PORT:-80}:80"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
