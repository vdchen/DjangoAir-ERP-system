services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-djangoair}
      POSTGRES_USER: ${POSTGRES_USER:-djangoair}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djangoair_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djangoair} -d ${POSTGRES_DB:-djangoair}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  backend:
    build:
      context: ./backend
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/ready/"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery_worker:
    build:
      context: ./backend
    command: celery -A config worker --loglevel=info
    env_file:
      - ${ENV_FILE:-.env.example}
    environment:
      APP_ENV: ${APP_ENV:-dev}
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy

  mobile_ws:
    build:
      context: ./services/mobile_ws
    environment:
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      REDIS_EVENTS_CHANNEL: ${REDIS_EVENTS_CHANNEL:-djangoair:events}
    depends_on:
      redis:
        condition: service_healthy

  webhook_mock:
    build:
      context: ./services/webhook_mock
    environment:
      WEBHOOK_DEFAULT_SECRET: ${WEBHOOK_DEFAULT_SECRET:-djangoair-webhook-dev-secret}

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
    ports:
      - "${NGINX_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
      mobile_ws:
        condition: service_started
      webhook_mock:
        condition: service_started

volumes:
  postgres_data:
